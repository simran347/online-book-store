{% extends "base.html" %}
{% load static %}

{% block title %}
login
{% endblock %}

{% block main %}
<div class="container-fluid">
    <div class="row mt-5 " style="background-image: url('{% static "img/download (9).jpg" %}'); background-repeat:no-repeat; background-size:cover;" >
        <div class="col-sm-9 mx-auto shadow">
            <div class="row">
                <div class="col-sm-6 p-3">
                    {% if messages %}
                    {% for m in messages %}
                    <div class=" alert alert-success alert-dismissible fade show" role="alert">
                        {{m}}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div> 
                    {% endfor %}
                    {% endif %}
                    <form method="post" class="p-3">
                        {% csrf_token %}
                        <h1 class=" text-center">login</h1>
                        <div class="form-floating mb-3">
                            <input type="email" name="username" class="form-control" id="floatingInput" placeholder="name@example.com">

                            <label for="floatingInput"><i class="fa-regular fa-user" style="color:green;"></i> Email
                                address</label>
                        </div>
                        <div class="form-floating">
                            <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password">
                            <label for="floatingPassword"> <i class="fa-solid fa-lock" style="color:green;"></i>
                                Password</label>
                        </div>
                        <div class="text-center mt-4">
                            <button class="btn btn-primary w-25 " type="submit">login</button>
                        </div>
                        </form>
                </div>
                <div class="col-sm-6 py-5">
                    <img src="{% static 'img/download (10).jpg' %}" alt="" style="height:500px; width:500px;"
                        class="img-fluid">
                </div>
                <br>
                <br>
            </div>
<br>
<br>
<br>
        </div>
        <br>

    </div>
</div>
</form>








{% endblock %}
