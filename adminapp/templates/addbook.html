{% extends 'adminbase.html'%}
{% block admin %}
<div class="row">
  <div class="col-sm-8 mx-auto  my-auto">
    <div class="card p-4">
      <form method="post"  class="mx-auto" enctype="multipart/form-data">
        {% csrf_token %}
    
        <div class="mb-3">
          <label for="formGroupExampleInput" class="form-label">title </label>
          <input type="text" name="title" class="form-control" id="formGroupExampleInput" placeholder="book title">
        </div>
        <div class="mb-3">
          <label for="formGroupExampleInput2" class="form-label">Author</label>
          <input type="text" class="form-control" name="author" id="formGroupExampleInput2" placeholder="Author name">
        </div>
        <div class="mb-3">
          <select name="category" class="form-control" id="">
            <option value="" disabled selected>--select category--</option>
            {% for c in cats %}
            <option value="{{c.id}}">{{c.name}}</option>
            {% endfor %}
          </select> 
        </div>
        <div class="mb-3">
          <label for="formGroupExampleInput2" class="form-label">description</label>
          <input type="text" class="form-control" name="description" id="formGroupExampleInput2" placeholder="description">
        </div>
        <div class="mb-3">
          <label for="formGroupExampleInput" class="form-label">original_price</label>
          <input type="number" step="0.01" name="original_price" class="form-control" id="formGroupExampleInput" placeholder="original_price">
        </div>
        <div class="mb-3">
          <label for="formGroupExampleInput2" class="form-label">Price</label>
          <input type="number" step="0.01" name="price" class="form-control" id="formGroupExampleInput2" placeholder="price">
        </div>
        <div class="mb-3">
          <label for="formGroupExampleInput" class="form-label">published_date</label>
          <input type="date" class="form-control" name="published_date" id="formGroupExampleInput" placeholder="date">
        </div>
        <div class="mb-3">
          <label for="formGroupExampleInput2" class="form-label">Language</label>
          <input type="text" class="form-control" name="language" id="formGroupExampleInput2" placeholder="Language">
        </div>
        <div class="mb-3">
          <label for="formGroupExampleInput" class="form-label">cover image</label>
          <input type="file" class="form-control" name="cover_image">
        </div>
        <div class="mb-3">
          <label for="formGroupExampleInput2" class="form-label">Stocks</label>
          <input type="number" class="form-control" name="stock" id="formGroupExampleInput2" placeholder="Stocks">
        </div>
        
       <div class="text-center">
        <button type="submit" class="btn btn-success">Add</button>
       </div> 
    </form>
    </div>
  </div>
</div>



{% endblock %}
